# Mémoire du démon Gradle augmentée pour gérer toutes les dépendances du projet
# (Spring Boot, MapStruct, MinIO, Firebase, iText, POI, Testcontainers…)
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Éviter les problèmes de chemins avec espaces
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=false

# Forcer le répertoire Gradle sans espaces
org.gradle.user.home=C:/gradle