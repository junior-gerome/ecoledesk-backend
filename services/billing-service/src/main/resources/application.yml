server:
  port: ${BILLING_SERVICE_PORT:8082}
  servlet:
    context-path: /api

spring:
  application:
    name: billing-service
  datasource:
    url: ${BILLING_DB_URL:jdbc:mysql://localhost:3306/school_billing?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false}
    username: ${BILLING_DB_USERNAME:root}
    password: ${BILLING_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
