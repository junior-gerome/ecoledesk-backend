server:
  port: ${ATTENDANCE_SERVICE_PORT:8083}
  servlet:
    context-path: /api

spring:
  application:
    name: attendance-service
  datasource:
    url: ${ATTENDANCE_DB_URL:jdbc:mysql://localhost:3306/school_attendance?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false}
    username: ${ATTENDANCE_DB_USERNAME:root}
    password: ${ATTENDANCE_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:}

school:
  api:
    base-url: ${SCHOOL_API_BASE_URL:http://localhost:8080/api}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
