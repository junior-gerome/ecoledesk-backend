# Connexion a la base de donnees MySQL : URL, utilisateur, mot de passe et pilote JDBC.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate/JPA : dialecte SQL adapte a MySQL.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Hibernate/JPA : valide le schema existant par defaut, sans le creer ni le modifier.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
# Affiche les requetes SQL generees seulement si JPA_SHOW_SQL vaut true.
spring.jpa.show-sql=${JPA_SHOW_SQL}
# Evite de conserver la session Hibernate ouverte pendant la generation de la reponse HTTP.
spring.jpa.open-in-view=false

# Formate les requetes SQL affichees dans les journaux pour les rendre plus lisibles.
spring.jpa.properties.hibernate.format_sql=true

# Flyway : execute et gere les migrations versionnees de la base de donnees.
spring.flyway.enabled=${FLYWAY_ENABLED}
# Autorise l'initialisation de l'historique Flyway sur une base deja existante.
spring.flyway.baseline-on-migrate=true
# Repare automatiquement l'historique Flyway avant les migrations.
#spring.flyway.repair-on-migrate=true
# Emplacement des scripts de migration dans les ressources de l'application.
spring.flyway.locations=classpath:db/migration

# HikariCP : taille maximale, nombre minimal de connexions inactives et delai d'inactivite du pool.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000

# Envoie les dates au format ISO-8601 plutot qu'en nombre de millisecondes.
spring.jackson.serialization.write-dates-as-timestamps=false

# Serveur HTTP : port d'ecoute et prefixe commun de toutes les routes de l'API.
server.port=8080
server.servlet.context-path=/api

# Desactive la page d'erreur HTML par defaut de Spring Boot ; les erreurs passent par /error.
server.error.whitelabel.enabled=false
server.error.path=/error

# Applique le filtre Spring Security aux requetes normales, aux erreurs et aux traitements asynchrones.
spring.security.filter.dispatcher-types=REQUEST,ERROR,ASYNC

# JWT : cle de signature et duree de validite des jetons d'acces et de rafraichissement, en millisecondes.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION}

# Creation facultative d'un administrateur initial au demarrage de l'application.
app.bootstrap.admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED}
app.bootstrap.admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL}
app.bootstrap.admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD}

# CORS : origines, methodes et en-tetes autorises pour les appels effectues depuis le navigateur.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD
app.cors.allowed-headers=Authorization,Content-Type,Accept,Origin,X-Requested-With,Access-Control-Request-Method,Access-Control-Request-Headers,X-Silent-Error
# En-tete rendu accessible au navigateur dans la reponse CORS.
app.cors.exposed-headers=Authorization
# Autorise l'envoi de cookies ou d'informations d'authentification avec les requetes CORS.
app.cors.allow-credentials=true
# Duree, en secondes, pendant laquelle le navigateur peut mettre en cache la reponse preflight CORS.
app.cors.max-age=3600

# Cache et Redis : type de cache par defaut, adresse, port et delai d'attente du serveur Redis.
spring.cache.type=${SPRING_CACHE_TYPE}
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.timeout=${REDIS_TIMEOUT}

# Actuator et Prometheus : endpoints exposes, niveau de detail de sante et metriques publiees.
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS}
management.prometheus.metrics.export.enabled=true
# Etiquette commune ajoutee a toutes les metriques de cette application.
management.metrics.tags.application=school-management
# Active l'histogramme de percentiles pour les durees des requetes HTTP serveur.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Prefixe des URLs des endpoints de supervision (par exemple /actuator/health).
management.endpoints.web.base-path=/actuator

# Niveaux de journalisation : application, SQL Hibernate, securite et couche Web.
logging.level.com.school.platform=${APP_LOG_LEVEL}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${HIBERNATE_BINDER_LOG_LEVEL}
logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL}
logging.level.com.school.platform.identityaccess.infrastructure.security=${APP_SECURITY_LOG_LEVEL}
logging.level.org.springframework.web=${SPRING_WEB_LOG_LEVEL}
logging.level.org.hibernate.type=${HIBERNATE_TYPE_LOG_LEVEL}
# Niveau de journalisation specifique au moteur de validation Hibernate Validator.
logging.level.org.hibernate.validator=${HIBERNATE_VALIDATOR_LOG_LEVEL}

# Active le pare-feu HTTP strict de Spring Security.
spring.security.firewall.strict=${SPRING_SECURITY_FIREWALL_STRICT}

# Types de documents obligatoires dans un dossier de prereglacement (types separes par des virgules).
# La soumission exige leur depot ; l'approbation du dossier exige leur statut APPROVED.
school.enrollment.required-document-types=BIRTH_CERTIFICATE,REPORT_CARD

# Televersement de fichiers : dossier de stockage et limites de taille.
file.upload-dir=${FILE_UPLOAD_DIR}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# Taille a partir de laquelle Spring ecrit temporairement le fichier sur disque.
spring.servlet.multipart.file-size-threshold=2KB

# Stockage objet MinIO (compatible S3) utilise pour les documents des workflows (preinscription, etc.).
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:school-documents}
minio.region=${MINIO_REGION:us-east-1}
minio.insecure=${MINIO_INSECURE:true}
# Liste des extensions autorisees pour le televersement.
minio.allowed-extensions=jpg,jpeg,png,webp,pdf

spring.profiles.active=dev
