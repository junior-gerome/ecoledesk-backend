spring.datasource.url=jdbc:mysql://localhost:3306/bd-gsbp?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000

spring.jackson.serialization.write-dates-as-timestamps=false


server.port=8080
server.servlet.context-path=/api   

server.error.whitelabel.enabled=false
server.error.path=/error


spring.security.filter.dispatcher-types=REQUEST,ERROR,ASYNC

jwt.secret=monSuperSecretTresLongAvec32CaracteresMinimum!
jwt.expiration=86400000  


spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration


management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=school-management
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.endpoints.web.base-path=/api/actuator


logging.level.com.school.management=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.security=TRACE
logging.level.com.school.management.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.type=TRACE


logging.level.org.hibernate.validator=DEBUG



spring.security.firewall.strict=false
