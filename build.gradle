// Ajoute la commande Gradle 'repairFlyway' pour reparer l'historique des migrations Flyway.
tasks.register('repairFlyway', JavaExec) {
    group = 'database' // Classe la tache dans le groupe 'database' de Gradle.
    description = 'Repairs Flyway schema history using the application datasource configuration.' // Description affichee par Gradle.
    dependsOn 'classes' // Compile le projet avant de lancer l'outil Java.
    classpath = sourceSets.main.runtimeClasspath // Utilise le code compile et toutes les dependances d'execution.
    mainClass = 'com.school.platform.shared.infrastructure.flyway.FlywayRepairTool' // Point d'entree Java de la reparation.
}