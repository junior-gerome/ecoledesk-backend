plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.5'
}

group = 'school'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    main {
        java {
            exclude 'com/school/gestionuser/**' // legacy sandbox: keep outside the modular monolith build
        }
    }
}
repositories {
    mavenCentral()
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }

    all {
        exclude group: 'commons-logging', module: 'commons-logging' // éviter conflit avec spring-boot
    }
}

def loadDotEnv = { File envFile ->
    def values = [:]

    if (!envFile?.exists()) {
        return values
    }

    envFile.eachLine('UTF-8') { rawLine ->
        def line = rawLine.trim()

        if (line && !line.startsWith('#')) {
            if (line.startsWith('export ')) {
                line = line.substring('export '.length()).trim()
            }

            def separatorIndex = line.indexOf('=')

            if (separatorIndex > 0) {
                def key = line.substring(0, separatorIndex).trim()
                def value = line.substring(separatorIndex + 1).trim()

                if (value.length() >= 2
                        && ((value.startsWith('"') && value.endsWith('"'))
                        || (value.startsWith("'") && value.endsWith("'")))) {
                    value = value.substring(1, value.length() - 1)
                }

                values[key] = value
            }
        }
    }

    values
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    // Base de données
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Sécurité - JWT (JJWT)
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // Validation Jakarta (optionnel : déjà inclus partiellement dans starter-validation)
    implementation 'jakarta.validation:jakarta.validation-api:3.0.2'
    implementation 'org.hibernate.validator:hibernate-validator:8.0.1.Final'

    // Excel
    implementation 'org.apache.poi:poi:5.2.3'
    implementation 'org.apache.poi:poi-ooxml:5.2.3'

    // PDF avec iText 7 (dépendances groupées ici)
    implementation 'com.itextpdf:itext7-core:7.2.5'
    implementation 'com.itextpdf:itextpdf:5.5.13.3'

    // Firebase Admin SDK
    implementation 'com.google.firebase:firebase-admin:9.1.1'

    // Redis Pool (nécessaire pour Lettuce ou Jedis)
    // implementation 'org.apache.commons:commons-pool2'

    // OpenAPI (Swagger avec Springdoc)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'
    implementation 'io.swagger.core.v3:swagger-annotations:2.2.8'

    // Monitoring / Prometheus
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.micrometer:micrometer-core'

    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    // Lombok is explicit so VS Code/JDT can resolve lombok.* imports after Gradle refresh.
    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'
    testCompileOnly 'org.projectlombok:lombok:1.18.38'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.38'

    // Tests
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.assertj:assertj-core:3.25.3'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter:1.19.5'
    testImplementation 'org.testcontainers:testcontainers:1.19.5'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('bootRun') {
    def repoEnvFile = rootProject.projectDir.parentFile?.toPath()?.resolve('.env')?.normalize()?.toFile()
    def backendEnvFile = rootProject.file('.env')

    [repoEnvFile, backendEnvFile].each { envFile ->
        loadDotEnv(envFile).each { key, value ->
            if (!System.getenv().containsKey(key) && !getEnvironment().containsKey(key)) {
                environment key, value
            }
        }
    }
}

tasks.register('repairFlyway', JavaExec) {
    group = 'database'
    description = 'Repairs Flyway schema history using the application datasource configuration.'
    dependsOn 'classes'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.school.platform.shared.infrastructure.flyway.FlywayRepairTool'
}